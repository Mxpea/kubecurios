import java.time.Duration

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        url = uri('https://maven.latvian.dev/releases')
        content { includeGroup('dev.latvian.mods') }
    }
    maven {
        url = uri('https://maven.theillusivec4.top')
        content { includeGroup('top.theillusivec4.curios') }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        attributeSmoke {
            server()
            programArgument '--nogui'
            gameDirectory = layout.buildDirectory.dir('attribute-smoke/run').get().asFile
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = name == 'attributeSmoke' ? org.slf4j.event.Level.INFO : org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Use the supplied binaries when requested, without copying or bundling them.
def localModsPath = providers.gradleProperty('kubecurios_mods_dir')
if (localModsPath.present) {
    def modsDir = file(localModsPath.get())
    def findModJar = { jarName ->
        def matches = modsDir.listFiles()?.findAll { it.isFile() && it.name.endsWith(jarName) } ?: []
        if (matches.size() != 1) {
            throw new GradleException("Expected one JAR ending with ${jarName} in ${modsDir}, found ${matches.size()}")
        }
        matches.first()
    }
    dependencies {
        implementation files(
                findModJar("kubejs-neoforge-${kubejs_version}.jar"),
                findModJar("curios-neoforge-${curios_version}.jar"),
                findModJar("rhino-${rhino_version}.jar"),
        )
        runtimeOnly files(findModJar("better-advanced-tooltips-${tooltips_version}.jar"))
    }
} else {
    dependencies {
        // KubeJS bundles its internal runtime libraries. Provide the external mods explicitly.
        implementation("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
        implementation "dev.latvian.mods:rhino:${rhino_version}"
        implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
        runtimeOnly "dev.latvian.mods:better-advanced-tooltips:${tooltips_version}"
    }
}

// Smoke fixtures are staged only for the isolated server, never in the mod JAR.
def smokeDirectory = layout.buildDirectory.dir('attribute-smoke/run')
var stageAttributeSmoke = tasks.register('stageAttributeSmoke', Copy) {
    into smokeDirectory
    from 'examples/attribute-smoke/automated'
    from('examples/attribute-smoke/kubejs') { into 'kubejs' }
    from('examples/attribute-smoke/datapack') { into 'world/datapacks/kubecurios_attribute_smoke' }
}
tasks.named('runAttributeSmoke').configure {
    dependsOn stageAttributeSmoke
    timeout = Duration.ofMinutes(3)
    doLast {
        def log = smokeDirectory.get().file('logs/latest.log').asFile
        def text = log.isFile() ? log.getText('UTF-8') : ''
        def expectedLogLines = [
                '[KubeCurios equipment] PASS: source slots, tags, cumulative equipped time and save/load, durability and enchantment',
                '[KubeCurios script] PASS: invalid definitions rejected',
                '[KubeCurios script] PASS: combat, equipment, command results and nested execution',
                "Curio 'kubecurios_smoke:missing_script' references undefined script 'kubecurios_smoke:undefined'",
                '[KubeCurios smoke] PASS: whitelist, existing item, helper, max health 20 -> 24 -> 28 -> 24 -> 20, command cooldown, signed damage, armor and tooltip visibility',
                "Curios whitelist item 'kubecurios_smoke:missing_item' is not registered for slot 'kubecurios_smoke_ring'",
                "Curios slot 'kubecurios_missing_slot' is not defined",
                "Curios slot 'kubecurios_unwired_slot' does not reference validator 'kubecurios:whitelist'",
                "Curios slot 'kubecurios_unwired_slot' is not assigned to any entity",
        ]
        def callbackSuffix = 'kubecurios_smoke:ward_ring in kubecurios_smoke_ring'
        def expectedCallbacks = [
                "[KubeCurios smoke] equipped ${callbackSuffix}[0]",
                "[KubeCurios smoke] equipped ${callbackSuffix}[1]",
                "[KubeCurios smoke] unequipped ${callbackSuffix}[0]",
                "[KubeCurios smoke] unequipped ${callbackSuffix}[1]",
        ]
        def missing = expectedLogLines.findAll { !text.contains(it) }
        def incorrectCounts = expectedCallbacks.findAll { text.count(it.toString()) != 1 }
        if (!missing.empty || !incorrectCounts.empty || text.contains('[KubeCurios smoke] FAIL:')) {
            throw new GradleException("KubeCurios smoke failed (missing: ${missing}, callback count mismatch: ${incorrectCounts}); see ${log}")
        }
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            kubejs_version         : kubejs_version,
            curios_version         : curios_version,
            tooltips_version       : tooltips_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
